/* 版面：桌機＝手機外框（參展者畫面）＋右側展場 QR 立牌面板；手機寬度＝全螢幕 App。
   主題：航海護照集章。顏色有分工：浮標橘＝自己動手的時間與印章，海水青＝AI 做的事，深海藍為底。 */
:root{
  --bg:#E6ECF0; --app:#F2F5F7; --card:#FFFFFF; --ink:#10233B; --muted:#55657A; --line:#D5DEE5;
  --navy:#0F2747; --navy-ink:#F2F6FA; --sea:#0B7381; --sea-ink:#FFFFFF; --sea-hi:#5CC4CF; --tint:#DCEDEF;
  --signal:#D4561A; --signal-ink:#FFFFFF; --tint2:#FBE6D8; --gold:#B87E0F; --ok:#1B7A45; --ok-bg:#E0F1E7; --bad:#B83232; --bad-bg:#F8E2E2;
  --log-hi:#7FE0E8; --log-warn:#FFB37A;
  --bezel:#0A1424; --island:#000000; --shadow:0 20px 50px rgba(15,39,71,.20); --soft:0 2px 8px rgba(15,39,71,.06);
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Barlow Condensed","Noto Sans TC",system-ui,sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#050F1B; --app:#0A1828; --card:#112338; --ink:#E5EDF5; --muted:#9CB0C4; --line:#22384F;
  --navy:#16355A; --navy-ink:#E5EDF5; --sea:#2EADB9; --sea-ink:#03202A; --sea-hi:#6FD3DD; --tint:#0E3440;
  --signal:#FF7D3A; --signal-ink:#2A1206; --tint2:#3A2416; --gold:#F0B442; --ok:#45C47F; --ok-bg:#0E3323; --bad:#F27272; --bad-bg:#3B1A1D;
  --log-hi:#7FE0E8; --log-warn:#FFB37A;
  --bezel:#000000; --island:#000000; --shadow:0 20px 50px rgba(0,0,0,.55); --soft:0 2px 8px rgba(0,0,0,.25); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#050F1B; --app:#0A1828; --card:#112338; --ink:#E5EDF5; --muted:#9CB0C4; --line:#22384F;
  --navy:#16355A; --navy-ink:#E5EDF5; --sea:#2EADB9; --sea-ink:#03202A; --sea-hi:#6FD3DD; --tint:#0E3440;
  --signal:#FF7D3A; --signal-ink:#2A1206; --tint2:#3A2416; --gold:#F0B442; --ok:#45C47F; --ok-bg:#0E3323; --bad:#F27272; --bad-bg:#3B1A1D;
  --log-hi:#7FE0E8; --log-warn:#FFB37A;
  --bezel:#000000; --island:#000000; --shadow:0 20px 50px rgba(0,0,0,.55); --soft:0 2px 8px rgba(0,0,0,.25); color-scheme:dark }

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.ic{width:20px;height:20px;flex:none;vertical-align:-4px}

/* ── 舞台：手機外框＋面板 ── */
.stage{min-height:100%;display:flex;gap:40px;align-items:center;justify-content:center;padding-block:24px;padding-inline:24px}
.phone{position:relative;height:min(844px,calc(100dvh - 48px));aspect-ratio:390/844;max-width:100%;min-width:0;background:var(--bezel);border-radius:54px;padding:11px;box-shadow:var(--shadow);flex:none}
.screen{position:relative;height:100%;border-radius:44px;overflow:hidden;background:var(--app);display:flex;flex-direction:column}
.status{height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 28px 0 32px;font:600 15px/1 var(--f-body);color:var(--ink)}
.status .sb{display:flex;gap:6px;align-items:center}
.status .sb svg{width:17px;height:17px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:108px;height:31px;background:var(--island);border-radius:20px;z-index:20}
.app{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;position:relative}

.panel{width:440px;flex:none;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font:900 26px/1.3 var(--f-body);margin:0;text-wrap:balance}
.panel p{margin:0;color:var(--muted)}
.eyebrow{font:700 12px/1.4 var(--f-body);letter-spacing:.14em;color:var(--sea);margin:0}
.guide{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px;line-height:1.55;color:var(--muted)}
.guide b{color:var(--ink)}
.qr-main{display:flex;align-items:center;gap:16px;padding:10px 14px 10px 10px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--soft);text-align:left}
.qr-main canvas{width:120px;height:120px;flex:none;border-radius:6px;image-rendering:pixelated}
.qr-main b{display:block;font-size:20px;font-weight:900;color:var(--sea)}
.qr-main span{display:block;font-size:15px;font-weight:700}
.qr-main small{display:block;margin-top:4px;font-size:13px;line-height:1.5;color:var(--muted)}
.qr-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.qr{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px 6px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--soft);transition:transform .15s}
.qr:hover,.qr-main:hover{transform:translateY(-2px)}
.qr canvas{width:62px;height:62px;display:block;border-radius:3px;image-rendering:pixelated}
.qr .qn{font:700 16px/1 var(--f-num);color:var(--sea)}
.qr .ql{font-size:11.5px;line-height:1.25;color:var(--ink);text-align:center}
.qr.cur,.qr-main.cur{border-color:var(--sea);box-shadow:0 0 0 2px var(--sea)}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.tools .btn{min-height:40px;padding:8px 16px;font-size:14px}
.fine{font-size:12.5px;line-height:1.6;color:var(--muted)}
.qrset{display:flex;flex-direction:column;gap:5px}
.qrset label{font-size:13px;font-weight:700}
.qrrow{display:flex;gap:8px}
.qrrow input{flex:1;min-width:0;font:13.5px/1.4 var(--f-mono);padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.qrrow input:focus-visible{outline:3px solid var(--sea);outline-offset:1px}
.qrrow .btn{min-height:42px;padding:8px 14px;font-size:14px;flex:none}
.panel .qrmsg{font-size:13px;line-height:1.55;padding:7px 12px;border-radius:12px;background:var(--tint);color:var(--ink)}
.panel .qrmsg[data-tone="warn"]{background:var(--tint2)}
.qrmsg:empty{display:none}

@media (max-width:999px){ .stage{flex-direction:column} .panel{width:min(600px,100%);order:-1} }
@media (max-width:599px){
  .stage{display:block;padding:0;min-height:0;height:100%}
  .phone{width:100%;height:100%;aspect-ratio:auto;border-radius:0;padding:0;box-shadow:none;background:var(--app)}
  .screen{border-radius:0}
  .status,.island,.panel{display:none}
}

/* ── App 共用 ── */
.scr{padding:14px 18px 32px;display:flex;flex-direction:column;gap:14px;animation:enter .3s ease both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.bar{position:sticky;top:0;z-index:10;background:var(--app)}
.topbar{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line)}
.topbar .tt{flex:1;min-width:0;display:flex;align-items:baseline;gap:6px;font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden}
.topbar .tt>span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.tn{font:700 17px/1 var(--f-num);color:var(--sea);letter-spacing:.02em}
.back{display:inline-flex;align-items:center;gap:4px;padding:7px 12px 7px 9px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--tint2);color:var(--signal);font:700 13px/1.4 var(--f-body);white-space:nowrap}
.pill .ic{width:16px;height:16px}
.watch{display:flex;align-items:center;gap:8px;padding:7px 16px;font-size:13.5px;font-weight:700;border-bottom:1px solid var(--line)}
.watch b{font:700 24px/1 var(--f-num);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.watch small{margin-left:auto;font-weight:500;color:var(--muted)}
.watch.w-me{background:var(--tint2);color:var(--signal)}
.watch.w-ai{background:var(--tint);color:var(--sea)}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:15px;text-align:center}
.btn.primary{background:var(--sea);border-color:var(--sea);color:var(--sea-ink)}
.btn.big{min-height:54px;font-size:17px;border-radius:16px}
.btn.wide{width:100%}
.btn.go{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--sea) 45%,transparent)}50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--sea) 0%,transparent)}}
.row{display:flex;gap:10px}
.row>*{flex:1}
.q{font-weight:700;font-size:16px}
.hint,.note{font-size:13px;color:var(--muted);line-height:1.6}
.note{border-top:1px dashed var(--line);padding-top:10px}
.slide{animation:enter .25s ease both}

/* 選項 */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{min-height:50px;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:15px;line-height:1.4;text-align:center;transition:transform .12s,border-color .12s}
.opts.one .opt{display:flex;align-items:center;gap:8px;text-align:left;font-weight:500}
.opts.folders .opt{display:flex;align-items:center;gap:8px;text-align:left}
.opts.folders .opt .ic{color:var(--gold)}
.opt:active{transform:scale(.98)}
.opt.ok{border-color:var(--sea);background:var(--tint);color:var(--ink)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--ink);animation:shake .35s}
.opt[disabled]{cursor:default}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.verdict{display:flex;align-items:flex-start;gap:8px;font-weight:700;padding:10px 12px;border-radius:12px}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}
.verdict span{color:var(--ink);font-weight:500}
.ai{border:1.5px solid var(--sea);background:var(--tint);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.ai-h{display:flex;align-items:center;gap:6px;font-weight:900;color:var(--sea);font-size:14px}
.ai dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}
.ai dt{color:var(--muted);font-size:13.5px}
.ai dd{margin:0;font-size:14px;min-width:0}
.mx{display:flex;flex-direction:column;gap:10px}

/* ── 歡迎 ── */
.welcome{min-height:100%;justify-content:center;gap:18px;padding-top:28px}
.welcome h1{font:900 38px/1.15 var(--f-body);letter-spacing:.02em}
.lead{font-size:16px;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;gap:12px;align-items:center}
.steps b{font:700 22px/1 var(--f-num);width:26px;flex:none}
.steps li:nth-child(1) b{color:var(--signal)}
.steps li:nth-child(2) b,.steps li:nth-child(3) b{color:var(--sea)}
.art{width:100%;max-width:330px;aspect-ratio:330/150;align-self:center}

/* ── 航線圖 ── */
.hub-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hub-head h1{font:900 30px/1.2 var(--f-body)}
.ring{--p:0;width:74px;height:74px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--signal) calc(var(--p)*1%),var(--line) 0)}
.ring>div{width:60px;height:60px;border-radius:50%;background:var(--app);display:grid;place-items:center;text-align:center;line-height:1}
.ring b{font:700 24px/1 var(--f-num)}
.ring small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.savedbox{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;background:var(--navy);color:var(--navy-ink);border-radius:16px;padding:14px 16px}
.savedbox small{display:block;font-size:12.5px;opacity:.8}
.savedbox .sv{font-size:15px;font-weight:700;line-height:1.1}
.savedbox .sv b{font:700 40px/1 var(--f-num);color:var(--sea-hi)}
.savedbox .mine{text-align:right;font-size:13px}
.savedbox .mine b{display:block;font:700 20px/1.1 var(--f-num)}
.savedbox .empty{font-size:14px;font-weight:500;opacity:.9}
.route{position:relative;display:flex;flex-direction:column;gap:10px}
.leg{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--muted);margin-top:4px}
.leg::after{content:"";flex:1;border-top:2px dashed var(--line)}
.stn{display:grid;grid-template-columns:30px 44px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:var(--soft)}
.stn-no{font:700 22px/1 var(--f-num);color:var(--sea);text-align:center}
.stn-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--tint);color:var(--sea)}
.stn.b .stn-ic{background:var(--tint2);color:var(--signal)}
.stn.b .stn-no{color:var(--signal)}
.stn-ic .ic{width:24px;height:24px}
.stn-t{display:flex;flex-direction:column;min-width:0;line-height:1.35}
.stn-t small{font-size:12px;color:var(--muted)}
.stn-t b{font-size:16px}
.stn-t span{font-size:12.5px;color:var(--muted)}
.stn-s{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:12px;color:var(--muted)}
.stn-s .svd{font:700 14px/1 var(--f-num);color:var(--sea);white-space:nowrap}
.mini-stamp{width:38px;height:38px;border-radius:50%;border:2.5px double var(--signal);color:var(--signal);display:grid;place-items:center;transform:rotate(-14deg);font:700 11px/1 var(--f-body)}
.goal{display:flex;align-items:center;gap:10px;background:var(--tint2);border-radius:14px;padding:12px 14px;font-size:14px}
.goal .ic{color:var(--signal);width:26px;height:26px}

/* ── 關卡說明 ── */
.hero{display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:20px;background:var(--navy);color:var(--navy-ink)}
.hero .big-ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--sea);color:var(--sea-ink);margin-bottom:6px}
.hero.b .big-ic{background:var(--signal);color:var(--signal-ink)}
.hero .big-ic .ic{width:30px;height:30px}
.hero small{font:700 14px/1.2 var(--f-num);letter-spacing:.12em;opacity:.8}
.hero h2{font:900 26px/1.25 var(--f-body)}
.hero p{opacity:.88;font-size:14.5px}
.load{display:flex;gap:14px;align-items:center}
.ld-n{display:flex;flex-direction:column;align-items:center;min-width:76px;flex:none}
.ld-n b{font:700 46px/1 var(--f-num);color:var(--signal)}
.ld-n span{font-size:13px;font-weight:700;color:var(--signal);text-align:center;line-height:1.3}
.sec h3,.load h3{font-size:14px;color:var(--muted);font-weight:700;margin-bottom:4px}
.how{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.how li{display:flex;gap:10px;align-items:center;font-size:14.5px}
.how b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--sea);color:var(--sea-ink);font:700 15px/1 var(--f-num);flex:none}
.how li:first-child b{background:var(--signal);color:var(--signal-ink)}
.flow{display:flex;flex-direction:column;gap:6px}
.flow-h{font-size:13px;font-weight:700;color:var(--muted)}
.flow ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:6px}
.flow li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12.5px;line-height:1.4;text-align:center;min-height:54px;display:grid;place-items:center}
.flow li.mid{border-color:var(--sea);color:var(--sea);font-weight:700}
.flow .arr{color:var(--muted);width:14px;height:14px;padding:0;border:0;background:none;min-height:0}
.flow .arr .ic{width:14px;height:14px}

/* ── 自己做（手動體驗） ── */
.xrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.xc{display:flex;flex-direction:column;gap:4px;min-width:0}
.xc:last-child:nth-child(odd){grid-column:span 2}
.xc small{font-size:12px;color:var(--muted)}
.cell{min-height:44px;border:1.5px dashed var(--line);border-radius:10px;background:var(--card);font-size:14px;text-align:left;padding:8px 10px;color:var(--muted)}
.cell.on{border-style:solid;border-color:var(--signal);color:var(--ink);font-weight:700;background:var(--tint2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14.5px;font-weight:500;text-align:left}
.chip.used{opacity:.35}
.chip.miss{border-color:var(--bad);animation:shake .35s}
.typed-line{min-height:2.8em;border-bottom:2px solid var(--signal);font-size:16px;font-weight:500;padding:4px 2px;line-height:1.5}
.heard{font-size:13.5px;color:var(--muted);background:var(--app);border-radius:10px;padding:8px 10px}
.quote-l{font-size:16px;font-weight:500;line-height:1.6}
.mock{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);font-size:13.5px}
.mk-bar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--app);border-bottom:1px solid var(--line);color:var(--muted);font-size:12.5px}
.mk-bar .ic{width:16px;height:16px}
.mk-b{padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.mk-t{font-weight:700;font-size:15px}

/* ── 交給 AI ── */
.handoff{display:flex;flex-direction:column;gap:14px}
.took{font-size:16px;font-weight:700}
.took b{font:700 34px/1 var(--f-num);color:var(--signal);margin-left:4px}
.proj p:first-child{font-size:14px;color:var(--muted)}
.bigt{font-size:18px;font-weight:700;line-height:1.2}
.bigt b{font:700 44px/1 var(--f-num);color:var(--signal)}
.pile{position:relative;height:100px}
.pile i{position:absolute;left:50%;width:156px;height:78px;margin-left:-78px;border-radius:10px;background:var(--card);border:1px solid var(--line);box-shadow:var(--soft)}
.pile i:nth-child(1){top:0;transform:rotate(-6deg)}
.pile i:nth-child(2){top:5px;transform:rotate(4deg)}
.pile i:nth-child(3){top:10px;transform:rotate(-2deg)}
.pile i:nth-child(4){top:15px}
.pile span{position:absolute;left:50%;top:44px;transform:translateX(-50%);font-weight:700;font-size:15px;color:var(--signal);white-space:nowrap}

/* ── AI 處理中 ── */
.aist{display:flex;flex-direction:column;gap:12px;min-width:0}
.ai-h.big{font-size:18px}
.ai-h.big .ic{width:24px;height:24px;animation:spin 2.4s linear infinite}
.ai-h.big.done .ic{animation:none}
@keyframes spin{to{transform:rotate(360deg)}}
.prog{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--sea);transition:width .15s linear}
.ai-count{font-size:14px;color:var(--muted)}
.ai-count b{font:700 36px/1 var(--f-num);color:var(--sea);margin-right:2px}
.steps-ai{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px}
.steps-ai li{font-size:12.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);transition:background .2s,border-color .2s}
.steps-ai li.on{border-color:var(--sea);background:var(--tint);color:var(--ink);font-weight:700}
.log{min-width:0;background:var(--navy);color:var(--navy-ink);border-radius:12px;padding:10px 12px;font:12.5px/1.65 var(--f-mono);height:calc(1.65em * 7 + 20px);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.log p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:enter .18s ease both}
.log .h{color:var(--log-hi)}
.log .w{color:var(--log-warn)}

/* ── 你來確認 ── */
.rv{display:flex;flex-direction:column;gap:12px}
.rank{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.rank span{display:block;font-size:12.5px;color:var(--muted)}

/* ── 結果 ── */
.stamp-wrap{display:grid;place-items:center;padding:8px 0 2px}
.stamp{width:150px;height:150px;border-radius:50%;border:6px double var(--signal);color:var(--signal);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transform:rotate(-12deg);text-align:center;background:color-mix(in srgb,var(--signal) 6%,transparent)}
.stamp.anim{animation:thunk .55s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes thunk{0%{transform:scale(2.3) rotate(-30deg);opacity:0}60%{transform:scale(.92) rotate(-10deg);opacity:1}100%{transform:scale(1) rotate(-12deg)}}
.stamp small{font:700 13px/1 var(--f-num);letter-spacing:.14em}
.stamp b{font:900 19px/1.25 var(--f-body);max-width:120px}
.stamp i{font-style:normal;font:700 12px/1 var(--f-body);border-top:1.5px solid currentColor;padding-top:4px;margin-top:2px}
.saved{text-align:center;display:flex;flex-direction:column;gap:4px}
.saved small{font-size:14px;font-weight:700;color:var(--muted)}
.saved .bigt b{font-size:52px;color:var(--sea)}
.cmp{display:flex;flex-direction:column;gap:14px}
.cmp-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;align-items:baseline}
.cmp-row span{font-size:13.5px;font-weight:700}
.cmp-row b{font:700 20px/1 var(--f-num);white-space:nowrap}
.cmp-row i{grid-column:1/-1;display:block;height:12px;border-radius:6px;min-width:6px;transform-origin:left;animation:grow .8s ease both}
.cmp-row i.b-me{background:var(--signal)}
.cmp-row i.b-ai{background:var(--sea)}
.cmp-row small{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.cmp .me-t{color:var(--signal)}
.cmp .ai-t{color:var(--sea)}
.month{font-size:13.5px;font-weight:700;color:var(--sea)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.reveal{display:flex;flex-direction:column;gap:12px}
.reveal h3{font-size:17px;display:flex;align-items:center;gap:6px}

/* 表格、文件 */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--navy);color:var(--navy-ink);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.best td{background:var(--ok-bg)}
.doc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-size:14px;box-shadow:var(--soft)}
.doc-t{font-weight:900;font-size:16px;text-align:center;padding-bottom:6px;border-bottom:1px solid var(--line)}
.doc-h{font-weight:700;margin-top:4px}
mark{background:var(--tint);color:var(--ink);padding:0 3px;border-radius:4px}
.mail{display:flex;flex-direction:column;gap:6px}
.mail-from{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.mail h3{font-size:17px}
.mail-body{font-size:14.5px}
.rec{display:flex;flex-direction:column;gap:12px}
.rec-t{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px}
.wave{display:flex;align-items:center;gap:3px;height:40px}
.wave i{flex:1;height:20%;border-radius:2px;background:var(--line)}
.wave.on i{background:var(--signal);animation:wv .9s ease-in-out infinite}
.wave.on i:nth-child(3n){animation-delay:-.3s}.wave.on i:nth-child(3n+1){animation-delay:-.6s}.wave.on i:nth-child(4n){animation-duration:.7s}
@keyframes wv{0%,100%{height:20%}50%{height:95%}}
.rec-ctl{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.rec-ctl .btn{min-height:42px;padding:8px 16px;font-size:14.5px}
.rec-ctl .btn .ic{width:16px;height:16px}
.txt-btn{background:none;border:0;padding:8px 2px;font-size:14px;font-weight:700;color:var(--sea);text-decoration:underline;text-underline-offset:3px}
.rec .hint{margin:0}
.need p{display:flex;justify-content:space-between;font-size:14px}
.need .need-h{font-weight:700;color:var(--ink);font-size:14.5px;margin-bottom:4px}
.file{display:flex;gap:12px;align-items:flex-start}
.ftype{width:46px;height:56px;border-radius:8px;flex:none;display:grid;place-items:end center;padding-bottom:6px;font:700 12px/1 var(--f-num);letter-spacing:.06em;color:#FFFFFF;background:var(--sea)}
.ftype.pdf{background:#B83A2E}.ftype.jpg{background:#6A4FB0}.ftype.docx{background:#2F5FB3}
.fname{font-weight:700;word-break:break-all}
.fsnip{font-size:13.5px;color:var(--muted);margin-top:4px}
.fold-sum{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fold-sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px}
.fold-sum b{display:flex;align-items:center;gap:6px;font-size:14px;margin-bottom:2px}
.fold-sum .ic{color:var(--gold)}
.sheet{font-size:13px}
.sheet th{background:var(--tint);color:var(--ink);text-align:center;font-weight:500}
.sheet td:first-child{color:var(--muted);text-align:center;width:28px;background:var(--tint)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar-r{display:grid;grid-template-columns:72px minmax(0,1fr) 52px;align-items:center;gap:8px;font-size:13px}
.bar-r .tr{height:18px;background:var(--line);border-radius:5px;overflow:hidden}
.bar-r .fl{display:block;height:100%;width:0;background:var(--sea);border-radius:5px;transition:width .8s ease}
.bar-r.top .fl{background:var(--signal)}
.bar-r .pc{text-align:right;font-variant-numeric:tabular-nums}
.ins{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.gantt{display:flex;flex-direction:column;gap:6px;font-size:12px}
.g-head,.g-row{display:grid;grid-template-columns:62px repeat(12,minmax(0,1fr)) 34px;align-items:center;gap:2px}
.g-head span{text-align:center;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.g-row .g-n{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-row .g-b{height:14px;border-radius:4px;background:var(--sea);transform-origin:left;animation:grow .6s ease both}
.g-row .g-w{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.slots{display:flex;justify-content:center;align-items:center;gap:6px;background:var(--navy);color:var(--navy-ink);border-radius:14px;padding:12px}
.slot{min-width:46px;padding:6px 8px;border-radius:8px;background:color-mix(in srgb,var(--navy-ink) 8%,transparent);border:1.5px solid var(--sea-hi);text-align:center;font:700 24px/1 var(--f-num);letter-spacing:.06em}
.slot-l{display:block;font:500 10px/1.2 var(--f-body);opacity:.75;margin-top:3px;letter-spacing:0}
.dash{font:700 22px/1 var(--f-num);opacity:.6}
.mailprev{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13.5px}
.mailprev .mp-sub{background:var(--navy);color:var(--navy-ink);font-weight:700;padding:10px 12px}
.mailprev .mp-b{padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.mailprev .mp-meta{color:var(--muted);font-size:12.5px}
.linkish{color:var(--sea);text-decoration:underline;text-underline-offset:3px}

/* 證書 */
.cert{gap:16px}
.cert-card{position:relative;border-radius:22px;padding:22px 20px;background:var(--navy);color:var(--navy-ink);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;overflow:hidden}
.cert-card::before{content:"";position:absolute;inset:8px;border:1.5px solid color-mix(in srgb,var(--navy-ink) 25%,transparent);border-radius:16px;pointer-events:none}
.cert-card small{font:700 13px/1 var(--f-num);letter-spacing:.2em;opacity:.8}
.cert-card h2{font:900 28px/1.25 var(--f-body)}
.cert-stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:6px 0}
.cert-stamps span{width:44px;height:44px;border-radius:50%;border:2.5px double var(--signal);color:var(--signal);display:grid;place-items:center;font:700 16px/1 var(--f-num);transform:rotate(-12deg);background:color-mix(in srgb,var(--signal) 8%,transparent)}
.cert-score{font-size:17px;font-weight:700}
.cert-score b{font:700 44px/1 var(--f-num);color:var(--sea-hi)}
.cert-mine{font-size:13.5px;opacity:.85}
.confirm{font-size:13px;color:var(--bad)}

@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important} }
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">
    <div class="screen">
      <div class="island" aria-hidden="true"></div>
      <div class="status" aria-hidden="true"><span id="clock">10:30</span><span class="sb">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="15" width="3" height="5" rx="1"/><rect x="7" y="11" width="3" height="9" rx="1"/><rect x="12" y="7" width="3" height="13" rx="1"/><rect x="17" y="3" width="3" height="17" rx="1"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M2 9a15 15 0 0 1 20 0"/><path d="M5.5 12.5a10 10 0 0 1 13 0"/><path d="M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19.5" r="1" fill="currentColor"/></svg>
        <svg viewBox="0 0 28 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="1" y="6" width="22" height="12" rx="3"/><rect x="3.5" y="8.5" width="15" height="7" rx="1.5" fill="currentColor" stroke="none"/><path d="M25 10v4" stroke-linecap="round"/></svg>
      </span></div>
      <div class="app" id="app" aria-live="polite"></div>
    </div>
  </div>

  <aside class="panel" id="panel" aria-label="展場模擬器控制面板">
    <p class="eyebrow">展場模擬器</p>
    <h2>電腦點著玩，手機掃 QR 玩</h2>
    <ol class="guide">
      <li><b>電腦：</b>直接點左邊的手機。點下方的關卡 QR，等於參展者掃了那一站的立牌。</li>
      <li><b>手機：</b>這一頁要用主機上的網址打開（例如 n8n），QR 才會指向那裡；手機連上同一個網路再掃「主 QR」。</li>
      <li><b>測試：</b>「填滿進度」直接看證書；「重設進度」連按兩次清除。</li>
    </ol>

/* ── 語音：用手機內建的中文語音唸出「錄音」；沒有語音或聽不到時改看文字 ── */
const TTS = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
if (TTS) { try { speechSynthesis.getVoices(); } catch (e) {} }   // 先觸發載入語音清單（部分瀏覽器是非同步載入）
const hush = () => { if (TTS) { try { if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel(); } catch (e) {} } };
function zhVoice() {
  let vs = []; try { vs = speechSynthesis.getVoices(); } catch (e) {}
  const L = v => (v.lang || '').replace(/_/g, '-').toLowerCase();
  const zh = vs.filter(v => /^(zh|cmn)/.test(L(v)) && !/(-hk|yue)/.test(L(v)));   // 國語，排除粵語
  return zh.find(v => /-tw$/.test(L(v))) || zh.find(v => /hant/.test(L(v))) || zh[0] || null;
}
// 回傳 { play, stop }。onText(msg) 會在需要改看文字時呼叫
function speaker(text, wave, btn, onText) {
  const label = t => { $('span', btn).textContent = t; };
  if (!TTS) { btn.disabled = true; label('無法播放'); onText('這個瀏覽器不能播放語音，已改顯示文字。'); return { play() {}, stop() {} }; }
  let alive = true, guard = 0;
  const play = () => {
    if (!alive) return;
    hush();
    const u = new SpeechSynthesisUtterance(text), v = zhVoice();
    if (v) u.voice = v;
    u.lang = v ? v.lang : 'zh-TW'; u.rate = 0.95;
    let started = false;
    u.onstart = () => { started = true; if (alive) { wave.classList.add('on'); label('播放中…'); } };
    u.onend = () => { if (alive) { wave.classList.remove('on'); label('再聽一次'); } };
    u.onerror = e => { if (!alive || e.error === 'interrupted' || e.error === 'canceled') return; wave.classList.remove('on'); label('再聽一次'); onText('這支手機沒有可用的中文語音，已改顯示文字。'); };
    try { speechSynthesis.speak(u); } catch (e) { onText('播放失敗，已改顯示文字。'); return; }
    clearTimeout(guard);
    guard = setTimeout(() => { if (alive && !started) { label('再聽一次'); onText('沒有偵測到聲音，已改顯示文字。'); } }, 5000);
  };
  btn.onclick = play;
  return { play, stop() { alive = false; clearTimeout(guard); wave.classList.remove('on'); hush(); } };
}

// 單選題：ok 為正確選項；ok 為 null 時任何選項都算完成。答錯會晃一下，碼表照走。
function ask(box, q, opts, ok = null, cls = '') {
  return new Promise(res => {

    $$('.opt', box).forEach(b => b.onclick = () => {
      const k = +b.dataset.k;
      if (ok !== null && k !== ok) { b.classList.remove('bad'); void b.offsetWidth; b.classList.add('bad'); return; }
      buzz();
      $$('.opt', box).forEach(x => { x.disabled = true; x.removeAttribute('data-auto'); x.classList.remove('bad'); });
      b.classList.add('ok');
      setTimeout(() => res(k), reduce ? 0 : 280);
    });
    box.lastElementChild.scrollIntoView({ block: 'nearest', behavior: smooth() });
  });
}

    let left = cells.length;
    $$('.cell', box).forEach(b => b.onclick = () => {
      if (b.classList.contains('on')) return;
      b.classList.add('on'); b.textContent = cells[+b.dataset.k][1]; b.removeAttribute('data-auto'); buzz();
      const nx = $('.cell:not(.on)', box); if (nx) nx.dataset.auto = '1';
      if (--left === 0) setTimeout(res, reduce ? 0 : 320);
    });
    box.lastElementChild.scrollIntoView({ block: 'nearest', behavior: smooth() });
  });
}
// 依序點詞句：模擬聽打或逐字撰寫；show 為詞句的顯示順序
function order(box, q, chunks, show) {
  return new Promise(res => {

      b.disabled = true; b.classList.add('used'); b.removeAttribute('data-auto'); $('#tl', box).textContent += chunks[k]; buzz(); i++;

}

      root.innerHTML = `<div class="card need slide"><p class="need-h">第 1／30 個價格：防蝕塗料 20L × 40 桶</p><p><span>甲廠單價</span><b>3,200</b></p><p><span>乙廠單價</span><b>3,350</b></p><p><span>丙廠單價</span><b>3,050</b></p></div><div class="mx" id="mx"></div>`;

        .concat([{ n: 29, c: 'h', t: '程式計算三家總價與價差' }, { n: 29, c: 'h', t: 'AI 撰寫採購建議' }, { n: 29, c: 'h', t: '檢查：建議內容與數字一致' }]),
      sum: `30 個價格比對完成，${QV[qBest].n}總價 ${fmt(qTot[qBest])} 元最低。` },
    review: { q: () => { const p = QI[1][2], a = ((p[1] - p[0]) / p[0] * 100).toFixed(1), c = ((p[1] - p[2]) / p[2] * 100).toFixed(1);
        return `<div class="ai"><p class="ai-h">${icon('spark')}AI 提醒</p><p>乙廠「防蝕塗料」單價 ${fmt(p[1])} 元，比甲廠高 ${a}%、比丙廠高 ${c}%，可能含運費，建議確認。</p></div><p class="q">你要怎麼處理？</p>`; },

    out: k => { const ord = [0, 1, 2].sort((a, b) => qTot[a] - qTot[b]);
      const fast = QV.reduce((m, v, i) => v.d < QV[m].d ? i : m, 0);
      const gap = qTot[fast] - qTot[qBest], pct = (gap / qTot[fast] * 100).toFixed(1);
      const longest = Math.max(...QV.map(v => v.d)) === QV[qBest].d;
      return `<div class="tbl"><table><tr><th>排名</th><th>廠商</th><th class="num">總價（元）</th><th class="num">交期</th></tr>${ord.map((v, r) => `<tr class="${v === qBest ? 'best' : ''}"><td>${r + 1}</td><td>${QV[v].n}</td><td class="num">${fmt(qTot[v])}</td><td class="num">${QV[v].d} 天</td></tr>`).join('')}</table></div>
        <div class="ai"><p class="ai-h">${icon('spark')}AI 採購建議</p><p>${QV[qBest].n}總價 ${fmt(qTot[qBest])} 元最低，比${QV[fast].n}少 ${fmt(gap)} 元（約 ${pct}%）${longest ? `，但交期 ${QV[qBest].d} 天最長` : ''}。若需在 ${QV[fast].d} 天內到貨，建議改選${QV[fast].n}。${k === 0 ? '另請乙廠說明防蝕塗料單價是否含運費。' : ''}</p></div>
        <p class="note">實際系統：價格排序與價差由程式計算，AI 只負責整理說明與建議，避免模型心算出錯；金額與推薦仍建議人工複核。</p>`; } },

const M = id => MODS.find(m => m.id === id);
const no = m => String(MODS.indexOf(m) + 1).padStart(2, '0');

/* ── 進度（只存在這支手機） ──
   一般存在瀏覽器儲存空間。n8n 回傳的網頁會被放進沙箱、不能用儲存空間，這時改把進度記在網址 # 後面，重新整理也不會不見。 */
const KEY = 'ai-voyage-v2';
const blank = () => ({ seen: false, done: {} });
let S = blank();
const canStore = (() => { try { localStorage.setItem(KEY + '-t', '1'); localStorage.removeItem(KEY + '-t'); return true; } catch (e) { return false; } })();
const inSrcdoc = location.href === 'about:srcdoc';   // n8n 1.103～1.11x 會把網頁包進 srcdoc 框架，網址列上的位址要從 baseURI 取得
const hashNow = () => { if (location.hash) return location.hash.slice(1); const u = inSrcdoc ? document.baseURI : ''; const i = u.indexOf('#'); return i < 0 ? '' : u.slice(i + 1); };
const pack = o => btoa(JSON.stringify([o.seen ? 1 : 0, Object.entries(o.done).map(([id, d]) => [id, ...[d.saved, d.mine, d.manual, d.proj].map(x => Math.round(x * 10) / 10)])])).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
function unpack(s) {
  const [seen, list] = JSON.parse(atob(s.replace(/-/g, '+').replace(/_/g, '/'))), done = {};
  list.forEach(([id, saved, mine, manual, proj]) => { if (M(id) && [saved, mine, manual, proj].every(Number.isFinite)) done[id] = { saved, mine, manual, proj }; });
  return { seen: !!seen, done };
}
function load() {
  if (canStore) { try { const v = JSON.parse(localStorage.getItem(KEY) || 'null'); if (v && v.done) return v; } catch (e) {} return blank(); }
  const m = /^v=([\w-]+)$/.exec(hashNow()); if (m) { try { return unpack(m[1]); } catch (e) {} }
  return blank();
}
function save() {
  if (canStore) { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} return; }
  if (inSrcdoc) return;   // 舊版 n8n 框架裡改不了網址，進度只留在這個畫面
  try { const h = '#v=' + pack(S); if (location.hash !== h) location.replace(h); } catch (e) {}
}
const count = () => Object.keys(S.done).length;
const totalSaved = () => Object.values(S.done).reduce((a, d) => a + d.saved, 0);
const totalMine = () => Object.values(S.done).reduce((a, d) => a + d.mine, 0);
function record(id, res) { S.done[id] = { saved: res.saved, mine: res.mine, manual: res.manual, proj: res.proj }; save(); }
function nextId(id) { const i = MODS.findIndex(m => m.id === id); for (let k = 1; k <= MODS.length; k++) { const m = MODS[(i + k) % MODS.length]; if (!S.done[m.id]) return m.id; } return null; }

/* ── 一站的流程：自己做 → 交給 AI → 你確認 → 結算 ── */
async function runStation(m, root, W, done) {
  const L = m.load, live = () => root.isConnected;
  let timer = 0;
  const watch = (cls, label, extra) => {
    clearInterval(timer); const t0 = now();
    W.hidden = false; W.className = `watch ${cls}`;
    W.innerHTML = `${icon('clock')}<span>${label}</span><b>00:00</b>${extra ? `<small>${extra}</small>` : ''}`;
    const b = $('b', W);
    timer = setInterval(() => { if (!live()) return clearInterval(timer); b.textContent = clock((now() - t0) / 1000); }, 250);
    return () => { clearInterval(timer); W.hidden = true; return (now() - t0) / 1000; };
  };
  // 1. 自己做
  let stop = watch('w-me', '自己做', `第 1／${L.n} ${L.u}`);
  await m.manual(root);
  if (!live()) return clearInterval(timer);
  const manual = stop();
  const perItem = manual / L.per, proj = perItem * L.n, rest = L.n - L.per;
  // 2. 交給 AI
  root.innerHTML = `<div class="handoff slide">
      <p class="took">你自己做了 ${L.per} ${L.u}，花了<b>${clock(manual)}</b></p>
      <div class="card proj"><p>照這個速度，${L.n} ${L.u}全部做完大約要</p><p class="bigt">${durHtml(proj)}</p></div>
      <div class="pile" aria-hidden="true"><i></i><i></i><i></i><i></i><span>還有 ${rest} ${L.u}</span></div>
      <button class="btn primary big go" id="hand" data-auto="1">${icon('spark')}剩下的 ${rest} ${L.u}交給 AI</button>
    </div>`;
  await new Promise(r => { $('#hand', root).onclick = r; });
  buzz();
  // 3. AI 處理
  await aiRun(m, root, live, rest);
  if (!live()) return;
  // 4. 你確認
  stop = watch('w-ai', '你確認的時間');
  const k = await review(m, root);
  if (!live()) return clearInterval(timer);
  const mine = stop();
  $('#fb', root).innerHTML = `<div class="verdict ok slide">${icon('check')}<span>${m.review.explain(k)}</span></div><button class="btn primary wide" id="fin" data-auto="1">完成，看 AI 幫你省下多少時間</button>`;
  $('#fin', root).scrollIntoView({ block: 'nearest', behavior: smooth() });
  await new Promise(r => { $('#fin', root).onclick = r; });
  if (live()) done({ manual, perItem, proj, mine, saved: Math.max(0, proj - mine), k });
}

async function aiRun(m, root, live, rest) {
  const A = m.ai, L = m.load, lines = A.lines();
  root.innerHTML = `<div class="aist slide">
      <p class="ai-h big" id="ah">${icon('spark')}<span>AI 處理中</span></p>
      <div class="prog" role="progressbar" aria-label="AI 處理進度" aria-valuemin="0" aria-valuemax="${rest}" aria-valuenow="0" id="pg"><i id="pb"></i></div>
      <p class="ai-count"><b id="pc">0</b>／${rest} ${L.u}</p>
      <ol class="steps-ai">${A.steps.map(s => `<li>${s}</li>`).join('')}</ol>
      <div class="log" id="log" aria-hidden="true"></div>
      <p class="hint">畫面為加速示範；實際由地端主機在背景處理，你不用守在電腦前。</p>
      <div id="ad"></div>
    </div>`;
  const log = $('#log', root), pb = $('#pb', root), pc = $('#pc', root), pg = $('#pg', root), st = $$('.steps-ai li', root);
  const T = reduce ? 400 : 4600;
  for (let i = 0; i < lines.length; i++) {
    if (!live()) return;
    const ln = lines[i], f = (i + 1) / lines.length;
    log.insertAdjacentHTML('beforeend', `<p class="${ln.c || ''}">${ln.t}</p>`);
    while (log.children.length > 7) log.firstElementChild.remove();
    pb.style.width = `${f * 100}%`;
    pc.textContent = Math.min(rest, ln.n); pg.setAttribute('aria-valuenow', pc.textContent);
    st.forEach((li, j) => li.classList.toggle('on', j < Math.ceil(f * st.length)));
    await wait(T / lines.length);
  }
  if (!live()) return;
  pc.textContent = rest; pg.setAttribute('aria-valuenow', rest); st.forEach(li => li.classList.add('on'));
  const ah = $('#ah', root); ah.classList.add('done'); ah.innerHTML = `${icon('check')}<span>AI 處理完成</span>`;
  $('#ad', root).innerHTML = `<div class="verdict ok slide">${icon('check')}<span>${A.sum}</span></div><button class="btn primary wide" id="rv" data-auto="1">還有 1 處要你確認</button>`;
  $('#rv', root).scrollIntoView({ block: 'nearest', behavior: smooth() });
  await new Promise(r => { $('#rv', root).onclick = r; });
}

function review(m, root) {

  root.innerHTML = `<div class="rv slide"><p class="eyebrow">AI 做完了，只有這 1 處要你確認</p>${R.q()}<div class="opts ${R.cls || 'one'}">${R.opts.map((o, k) => `<button class="opt" data-k="${k}"${k === auto ? ' data-auto="1"' : ''}>${o}</button>`).join('')}</div><div id="fb" class="reveal"></div></div>`;

/* ── 展場 QR 立牌面板（桌機）──
   QR 內容＝參展者手機要開的網址：主 QR＝入口，加上 #m1～#m10＝直接進入該站。
   網頁放在主機上（例如 n8n）並用那個網址開啟時，自動用網址列上的位址；從電腦直接開檔、或在 Claude 預覽裡，請在面板填入網址。 */
/* QR 編碼器（Model 2、位元組模式、版本 1–20）：網址要等打開頁面才知道，所以在瀏覽器裡即時編碼，不用外部函式庫 */
const QR = (() => {
  const ECW = { L: [7, 10, 15, 20, 26, 18, 20, 24, 30, 18, 20, 24, 26, 30, 22, 24, 28, 30, 28, 28], M: [10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26] };
  const NBL = { L: [1, 1, 1, 1, 1, 2, 2, 2, 2, 4, 4, 4, 4, 4, 6, 6, 6, 6, 7, 8], M: [1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16] };
  const FMT = { L: 1, M: 0 };
  const rawBits = v => { let r = (16 * v + 128) * v + 64; if (v >= 2) { const a = Math.floor(v / 7) + 2; r -= (25 * a - 10) * a - 55; if (v >= 7) r -= 36; } return r; };
  const dataCw = (v, e) => Math.floor(rawBits(v) / 8) - ECW[e][v - 1] * NBL[e][v - 1];
  const gmul = (x, y) => { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z & 255; };
  const divisor = d => { const r = new Array(d).fill(0); r[d - 1] = 1; let root = 1;
    for (let i = 0; i < d; i++) { for (let j = 0; j < d; j++) { r[j] = gmul(r[j], root); if (j + 1 < d) r[j] ^= r[j + 1]; } root = gmul(root, 2); } return r; };
  const remainder = (data, dv) => { const r = dv.map(() => 0);
    for (const b of data) { const f = b ^ r.shift(); r.push(0); dv.forEach((c, i) => { r[i] ^= gmul(c, f); }); } return r; };
  const alignPos = (v, n) => { if (v === 1) return []; const a = Math.floor(v / 7) + 2, step = Math.ceil((v * 4 + 4) / (a * 2 - 2)) * 2;
    const r = [6]; for (let p = n - 7; r.length < a; p -= step) r.splice(1, 0, p); return r; };
  const MASK = [(x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, (x, y) => x % 3 === 0, (x, y) => (x + y) % 3 === 0,
    (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => x * y % 2 + x * y % 3 === 0,
    (x, y) => (x * y % 2 + x * y % 3) % 2 === 0, (x, y) => ((x + y) % 2 + x * y % 3) % 2 === 0];
  function penalty(m, n) {
    let s = 0;
    const F = [1, 0, 1, 1, 1, 0, 1];
    for (let pass = 0; pass < 2; pass++) for (let a = 0; a < n; a++) {
      const line = new Array(n);
      for (let b = 0; b < n; b++) line[b] = pass ? m[b * n + a] : m[a * n + b];
      const at = i => (i < 0 || i >= n) ? 0 : line[i];
      let run = 1;
      for (let b = 1; b < n; b++) { if (line[b] === line[b - 1]) { run++; if (run === 5) s += 3; else if (run > 5) s++; } else run = 1; }
      for (let b = 0; b + 7 <= n; b++) {
        let hit = true; for (let k = 0; k < 7; k++) if (line[b + k] !== F[k]) { hit = false; break; }
        if (hit && ([1, 2, 3, 4].every(k => at(b - k) === 0) || [0, 1, 2, 3].every(k => at(b + 7 + k) === 0))) s += 40;
      }
    }
